# ────────────────
#  REFERENCE FILE
# ────────────────
#
# TO ADD A REAL EVENT
#
#   1. Copy this file to `YYYY-MM-DD-short-name.yaml`. The filename is for file explorer ordering; the `start`
#      field below is what the site actually reads.
#   2. Edit the fields. `title` and `start` are required; everything else is optional.
#   3. Remove `draft: true` when ready to publish
#   4. Run `just dev` and look at the homepage. A malformed file fails the build with the field
#      name in the error, rather than rendering a blank section.
#

draft: true

title:
  en: EXAMPLE EVENT — Fall coat and blanket drive
  es: EVENTO DE EJEMPLO — Colecta de abrigos y cobijas de otoño

start: 2026-09-26T10:00:00-05:00 # NOTE: use `-05:00` suffix during daylight saving, `-06:00` otherwise
end: 2026-09-26T13:00:00-05:00

location:
  en: Grace UMC parking lot, Old East Dallas
  es: Estacionamiento de Grace UMC, Old East Dallas

description:
  en: >-
    This is an example entry used to test the website — it is not a real event, and nobody should
    travel to it. Sample text follows. Bring coats, blankets, and cold-weather layers to the tent
    in the parking lot; volunteers will sort on the spot, so there is no need to come inside. Adult
    and children's sizes are both welcome, and clean used items are as useful as new ones.
  es: >-
    Este es un evento de ejemplo para probar el sitio web — no es un evento real y nadie debe
    presentarse. El texto siguiente es de muestra. Traiga abrigos, cobijas y ropa de invierno a la
    carpa del estacionamiento; los voluntarios los clasificarán allí mismo, así que no hace falta
    entrar. Se aceptan tallas de adulto y de niño, y la ropa usada limpia es tan útil como la nueva.

signUpUrl: https://example.org/example-signup-not-a-real-link
