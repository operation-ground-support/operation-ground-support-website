# ────────────────
#  REFERENCE FILE
# ────────────────
#
# TO ADD A REAL EVENT
#
#   1. Copy this file to `YYYY-MM-DD-short-name.yaml`. The filename is for file explorer ordering; the `start`
#      field below is what the site actually reads.
#   2. Edit the fields. `title` and `start` are required; everything else is optional. If the time
#      is not set yet, write `date: 2026-09-26` instead of `start` and `end`, and the card says
#      the time is to be confirmed.
#   3. Remove `draft: true` when ready to publish
#   4. Run `just dev` and look at the homepage. A malformed file fails the build with the field
#      name in the error, rather than rendering a blank section.
#

draft: true

title:
  en: EXAMPLE EVENT — Fall coat and blanket drive
  es: EVENTO DE EJEMPLO — Colecta de abrigos y cobijas de otoño

start: 2026-09-26T10:00:00-05:00 # NOTE: use `-05:00` suffix during daylight saving, `-06:00` otherwise
end: 2026-09-26T13:00:00-05:00

location:
  en: Grace UMC parking lot
  es: Estacionamiento de Grace UMC
address: 123 Example St, Dallas # optional: shown on its own line under the location

description:
  en: >-
    This is an example entry used to test the website — it is not a real event, and nobody should
    travel to it. Sample text follows. Bring coats, blankets, and cold-weather layers to the tent
    in the parking lot; volunteers will sort on the spot, so there is no need to come inside. Adult
    and children's sizes are both welcome, and clean used items are as useful as new ones.
  es: >-
    Este es un evento de ejemplo para probar el sitio web — no es un evento real y nadie debe
    presentarse. El texto siguiente es de muestra. Traiga abrigos, cobijas y ropa de invierno a la
    carpa del estacionamiento; los voluntarios los clasificarán allí mismo, así que no hace falta
    entrar. Se aceptan tallas de adulto y de niño, y la ropa usada limpia es tan útil como la nueva.

signUpUrl: https://example.org/example-signup-not-a-real-link
# The button's text. Leave it out and the button says "Volunteer"; use this when the form is the
# event's own rather than the general volunteer sign-up.
signUpLabel:
  en: Sign up for this event
  es: Inscríbase para este evento

# Photos: as many as you like, in a row at the top of the card, drawn smaller the more there are.
# Add each with `just add-event-photo`, which strips the location data phones put in photos,
# naming it with this event's date so it sorts beside this file. Anyone identifiable should have
# agreed to be on the site (a child through a parent or guardian). Left as comments here because
# this example has no photo beside it, and a missing file fails the build.
#
# photos:
#   - src: ./2026-09-26-coat-drive-1.jpg
#     alt:
#       en: What the photo shows, for someone who cannot see it.
#       es: Lo que muestra la foto, para quien no puede verla.
#     focus: center 70% # optional: which part to keep when it is cropped
# photoCaption: # optional: one line under the photos, saying what they show and when
#   en: Last year's coat drive, October 2025
#   es: La colecta de abrigos del año pasado, octubre de 2025
