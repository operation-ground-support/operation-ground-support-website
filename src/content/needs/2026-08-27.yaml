# What we need right now.
#
# Transcribed from the "currently collecting" list on the Squarespace site on 2026-08-27.
#
# HOW TO UPDATE: copy this file to a new one named for today's date and edit it. Do not edit old
# files — the history is the record that this organization is active, and a funder checking
# whether you are dormant looks at exactly this.
#
# Mark two or three things `urgent: true` when they are genuinely short. If everything is urgent,
# nothing is; the marker stops meaning anything and the list stops being useful.
#
# Each entry can be a plain string (English only) or `{en: ..., es: ...}`. Quote any value that
# contains a comma, or YAML reads it as the start of another key.

