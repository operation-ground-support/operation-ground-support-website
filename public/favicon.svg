  This is scaffolding, not the logo. When the real bridge mark exists, replace this file and add
  the lockups alongside it. Things to ask the designer for, since a wordmark PNG is not enough:

    - a horizontal lockup and a stacked lockup
    - an icon-only mark that is still legible at 32px and at 16px
    - a single-colour version, for print and the church bulletin
    - a favicon set derived from the icon
    - the palette, so `--accent` in global.css can be re-derived from the mark

  A bridge is easy to draw and hard to draw simply; the failure mode is a mark with too many
  spans that turns to mush when small. Push toward fewer, heavier strokes than feel right at
  full size.
-->
